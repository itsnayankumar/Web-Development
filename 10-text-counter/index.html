<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Text Counter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Text Counter</h1>

  <textarea id="text" rows="8" cols="50" placeholder="Start typing here..."></textarea>

  <div id="stats">
    <p>Characters: <span id="chars">0</span></p>
    <p>Characters (no spaces): <span id="charsNoSpaces">0</span></p>
    <p>Words: <span id="words">0</span></p>
    <p>Lines: <span id="lines">0</span></p>
  </div>

  <button id="clear">Clear</button>

  <script src="script.js"></script>
</body>
</html>
